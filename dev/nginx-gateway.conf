# Testing-only same-origin gateway. Do not use in production.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 8090;
  server_name _;
  client_max_body_size 20m;
  client_body_buffer_size 2m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_read_timeout 86400s;

  location /api/ {
    set $kerjo_backend http://backend:8000;
    proxy_pass $kerjo_backend;
  }

  location /health/ {
    set $kerjo_backend http://backend:8000;
    proxy_pass $kerjo_backend;
  }

  location / {
    set $kerjo_expo http://host.docker.internal:8081;
    proxy_pass $kerjo_expo;
    # Metro only allows localhost. Rewrite the tunneled Host/Origin so asset
    # requests from the public HTTPS origin are treated as local. Testing-only.
    proxy_set_header Host localhost:8081;
    proxy_set_header Origin http://localhost:8081;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
